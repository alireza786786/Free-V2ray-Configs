name: Unified Collector (auto-chain, 3 tokens)

on:
  workflow_dispatch:      # اجرای دستی و زنجیره‌ای

concurrency:
  group: collector-run
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run Telegram Collector
        run: python src/telegram_collector.py

      # --- مدیریت چرخش ۳ توکن کلاسیک بدون انقضا ---
      - name: Select Token (3-Token Rotation)
        id: select-token
        run: |
          mkdir -p data
          COUNTER_FILE="data/token_state.txt"
          if [ ! -f "$COUNTER_FILE" ]; then
            echo "0" > "$COUNTER_FILE"
          fi
          COUNTER=$(cat "$COUNTER_FILE")
          echo "Current token counter: $COUNTER"

          if [ "$COUNTER" -eq 0 ]; then
            echo "token=${{ secrets.GH_TOKEN }}" >> $GITHUB_OUTPUT
            echo "Using Token 0 (GH_TOKEN)"
          elif [ "$COUNTER" -eq 1 ]; then
            echo "token=${{ secrets.GH_TOKEN_1 }}" >> $GITHUB_OUTPUT
            echo "Using Token 1 (GH_TOKEN_1)"
          else
            echo "token=${{ secrets.GH_TOKEN_2 }}" >> $GITHUB_OUTPUT
            echo "Using Token 2 (GH_TOKEN_2)"
          fi

          NEXT=$(( (COUNTER + 1) % 3 ))
          echo "$NEXT" > "$COUNTER_FILE"

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
          RUN_MODE: frequent
          MAX_AGE_HOURS: 0.5
        run: python src/collector_git.py

      - name: Split joined proxy links
        run: |
          if [ -f all_servers.txt ]; then
            python src/split_links.py all_servers.txt
          fi

      - name: Advanced dedup configs
        run: |
          if [ -f all_servers.txt ]; then
            python src/dedup_configs.py all_servers.txt
          fi

      # --- حذف کانفیگ‌های مرده پیش از بازسازی (DNS + تست TCP + قرنطینه) ---
      - name: Prune dead configs
        timeout-minutes: 15
        continue-on-error: true
        run: python -u src/prune_dead.py --max-check 25000

      - name: Rebuild protocol & country files with Goodbaye 5-Line Remark
        timeout-minutes: 25
        run: python -u src/rebuild_protocols.py

      # --- شمارنده همگام ۳ ساعته (دور ششم) ---
      - name: Increment 3-Hour Cycle Counter
        run: |
          mkdir -p data
          COUNTER_FILE="data/publish_counter.txt"
          COUNT=0
          if [ -f "$COUNTER_FILE" ]; then
            COUNT=$(cat "$COUNTER_FILE")
          fi
          COUNT=$((COUNT + 1))
          echo "$COUNT" > "$COUNTER_FILE"
          echo "Cycle run #$COUNT"

      # --- ارسال به تلگرام (۳ پکیج تأییدشده در دور ششم) ---
      - name: Publish to Telegram (Every 6th run)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID || '@Goodbaye_filtering' }}
        run: python src/telegram_publisher.py

      # --- انتشار Release رسمی گیت‌هاب با قالب VestraNet (در دور ششم) ---
      - name: Publish GitHub Release (Every 6th run)
        env:
          GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
        run: python src/release_publisher.py

      - name: Commit and push updated files
        timeout-minutes: 5
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          mkdir -p servers data
          touch all_servers.txt
          git add -A all_servers.txt servers/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Update all servers & countries [skip ci]"
            git pull --rebase --strategy-option ours
            git push
          fi

      - name: Trigger next run
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'collector.yml',
              ref: 'main'
            });
