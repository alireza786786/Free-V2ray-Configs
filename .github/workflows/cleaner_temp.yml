name: Temp Channel Cleaner

on:
  workflow_dispatch:      # اجرای دستی برای اعتبارسنجی کانال‌ها

jobs:
  clean-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Requests
        run: pip install requests

      - name: 🔍 Run Channel Cleaner & Validator
        run: python src/channel_cleaner.py

      - name: 💾 Commit Cleaned Channel Lists
        run: |
          git config user.name "Goodbaye Cleaner Bot"
          git config user.email "bot@goodbaye.internal"
          git add data/channels_cleaned.txt data/invalid_channels.txt 2>/dev/null || true
          git commit -m "🧹 Update Cleaned and Invalid Telegram Channels" || echo "No changes to commit"
          git pull --rebase --strategy-option ours
          git push
